    <ellipse cx="32" cy="32" rx="12.5" ry="18" fill="url(#bean)"/>
    <path d="M32 16 C 35 24 35 40 32 48" stroke="#13265F" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>
